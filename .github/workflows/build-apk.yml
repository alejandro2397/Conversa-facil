name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate secrets availability
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Verificando secretos..."
          SECRETS_OK=true

          if [ -z "$KEYSTORE_B64" ]; then
            echo "RELEASE_KEYSTORE_BASE64: MISSING"
            SECRETS_OK=false
          else
            echo "RELEASE_KEYSTORE_BASE64: SET"
          fi

          if [ -z "$STORE_PWD" ]; then
            echo "RELEASE_STORE_PASSWORD: MISSING"
            SECRETS_OK=false
          else
            echo "RELEASE_STORE_PASSWORD: SET"
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "RELEASE_KEY_ALIAS: MISSING"
            SECRETS_OK=false
          else
            echo "RELEASE_KEY_ALIAS: SET"
          fi

          if [ -z "$KEY_PWD" ]; then
            echo "RELEASE_KEY_PASSWORD: MISSING"
            SECRETS_OK=false
          else
            echo "RELEASE_KEY_PASSWORD: SET"
          fi

          if [ "$SECRETS_OK" = false ]; then
            echo "Faltan uno o más secretos."
            exit 1
          fi

          echo "Todos los secretos están disponibles."

      - name: Decode and validate keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Decodificando keystore..."

          printf '%s' "$KEYSTORE_B64" |
            tr -d '[:space:]' |
            base64 --decode --ignore-garbage > release-key.p12

          if [ ! -s release-key.p12 ]; then
            echo "❌ El keystore quedó vacío."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s release-key.p12)
          echo "✅ Keystore decodificado: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -ne 2792 ]; then
            echo "❌ El Secret RELEASE_KEYSTORE_BASE64 no coincide con el keystore original."
            echo "   Esperados: 2792 bytes"
            echo "   Obtenidos: ${FILE_SIZE} bytes"
            echo "   El problema está en el contenido del Secret, no en Gradle."
            exit 1
          fi

          echo "Validando PKCS12 y alias..."

          keytool -list             -storetype PKCS12             -keystore release-key.p12             -storepass "$RELEASE_STORE_PASSWORD"             >/dev/null

          keytool -list             -storetype PKCS12             -keystore release-key.p12             -storepass "$RELEASE_STORE_PASSWORD"             -alias "$RELEASE_KEY_ALIAS"             >/dev/null

          echo "✅ Keystore PKCS12 y alias válidos."

          unset KEYSTORE_B64
      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Compilando APK de release firmado..."
          gradle assembleRelease --stacktrace
          echo "Compilación exitosa."

      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: conversa-facil-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f "${{ github.workspace }}/release-key.jks"
          echo "Limpieza completada."
