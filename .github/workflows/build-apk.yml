name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 🔐 Verificación segura de secretos - Solo muestra SET/MISSING
      - name: Validate secrets availability
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "🔍 Verificando disponibilidad de secretos..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Verificar cada secreto sin imprimir su valor
          SECRETS_OK=true
          
          if [ -z "$KEYSTORE_B64" ]; then
            echo "RELEASE_KEYSTORE_BASE64: MISSING ❌"
            SECRETS_OK=false
          else
            echo "RELEASE_KEYSTORE_BASE64: SET ✓"
          fi
          
          if [ -z "$STORE_PWD" ]; then
            echo "RELEASE_STORE_PASSWORD: MISSING ❌"
            SECRETS_OK=false
          else
            echo "RELEASE_STORE_PASSWORD: SET ✓"
          fi
          
          if [ -z "$KEY_ALIAS" ]; then
            echo "RELEASE_KEY_ALIAS: MISSING ❌"
            SECRETS_OK=false
          else
            echo "RELEASE_KEY_ALIAS: SET ✓"
          fi
          
          if [ -z "$KEY_PWD" ]; then
            echo "RELEASE_KEY_PASSWORD: MISSING ❌"
            SECRETS_OK=false
          else
            echo "RELEASE_KEY_PASSWORD: SET ✓"
          fi
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ "$SECRETS_OK" = false ]; then
            echo ""
            echo "❌ ALGUNOS SECRETOS NO ESTÁN DISPONIBLES"
            echo ""
            echo "🔧 Diagnóstico:"
            echo "  1. Este workflow se ejecuta desde: ${{ github.ref }}"
            echo "  2. Contexto: ${{ github.event_name }}"
            echo "  3. Rama: ${{ github.ref_name }}"
            echo ""
            echo "✅ Soluciones:"
            echo "  • Verifica que los secretos existan en Settings → Secrets and variables → Actions"
            echo "  • Los secretos deben estar configurados a nivel REPOSITORY (no ORGANIZATION)"
            echo "  • Si es un fork, copia los secretos al repositorio forked"
            echo ""
            exit 1
          fi
          
          echo "✅ Todos los secretos están disponibles"

      # 🔑 Decodificar y validar el keystore
      - name: Decode and validate keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "🔓 Decodificando keystore desde Base64..."
          
          # Decodificar el Base64 en el archivo .jks
          echo "$KEYSTORE_B64" | base64 --decode > "${{ github.workspace }}/release-key.jks" 2>/dev/null
          
          # Validar que el archivo se creó y tiene contenido
          if [ ! -f "${{ github.workspace }}/release-key.jks" ]; then
            echo "❌ ERROR: No se pudo crear el archivo keystore"
            exit 1
          fi
          
          # Verificar que no está vacío
          if [ ! -s "${{ github.workspace }}/release-key.jks" ]; then
            echo "❌ ERROR: El archivo keystore está vacío"
            echo "          El Base64 decodificó a 0 bytes"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z "${{ github.workspace }}/release-key.jks" 2>/dev/null || stat -c%s "${{ github.workspace }}/release-key.jks" 2>/dev/null)
          echo "✅ Keystore decodificado exitosamente (${FILE_SIZE} bytes)"
          
          # Limpiar variables sensibles de la memoria
          unset KEYSTORE_B64

      # 🛠️ Compilar APK firmado
      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "🔨 Compilando APK de release firmado..."
          gradle assembleRelease --stacktrace
          
          if [ $? -eq 0 ]; then
            echo "✅ Compilación exitosa"
          else
            echo "❌ La compilación falló"
            exit 1
          fi

      # 📦 Subir el APK como artefacto
      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: conversa-facil-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 🧹 Limpiar secretos después de usarlos
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f "${{ github.workspace }}/release-key.jks"
          echo "✅ Archivos sensibles eliminados"
