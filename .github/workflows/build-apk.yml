name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - redesign-1.1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "❌ Falta RELEASE_KEYSTORE_BASE64"; exit 1; }
          [ -n "$STORE_PWD" ] || { echo "❌ Falta RELEASE_STORE_PASSWORD"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "❌ Falta RELEASE_KEY_ALIAS"; exit 1; }
          [ -n "$KEY_PWD" ] || { echo "❌ Falta RELEASE_KEY_PASSWORD"; exit 1; }
          echo "✅ Los 4 Secrets están disponibles."

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > release-key.p12
          SIZE=$(stat -c%s release-key.p12)
          echo "Keystore decodificado: ${SIZE} bytes"
          [ "$SIZE" -gt 0 ] || { echo "❌ Keystore vacío."; exit 1; }

      - name: Validate PKCS12 keystore
        env:
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -Eeuo pipefail
          keytool -list -storetype PKCS12 -keystore release-key.p12 -storepass "$STORE_PWD"
          keytool -list -storetype PKCS12 -keystore release-key.p12 -storepass "$STORE_PWD" -alias "$KEY_ALIAS"
          echo "✅ Keystore PKCS12 y alias válidos."

      - name: Build release APK and AAB
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload signed APK and AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: conversa-facil-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -f release-key.p12 release-key.jks
          echo "✅ Limpieza completada."
